<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="header">
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="greeting" class="greeting"></div>
    <div id="clock" class="clock"></div>
  </header>
  <main id="grid" class="grid"></main>
  <div id="empty-state" class="empty-state" hidden>
    <p>This folder is empty.</p>
  </div>
  <div id="context-menu" class="context-menu" hidden>
    <div data-action="open-newtab" class="ctx-item">Open in new tab</div>
    <div data-action="open-current" class="ctx-item">Open in current tab</div>
    <div data-action="copy-url" class="ctx-item">Copy URL</div>
    <hr class="ctx-divider">
    <div data-action="edit" class="ctx-item">Edit</div>
    <div data-action="delete" class="ctx-item danger">Delete</div>
  </div>
  <div id="settings-panel" class="settings-panel" hidden>
    <h3>Settings</h3>
    <label class="setting-row">
      <span>24-hour time</span>
      <input type="checkbox" id="toggle-24h">
    </label>
    <label class="setting-row">
      <span>Dark mode</span>
      <input type="checkbox" id="toggle-dark" checked>
    </label>
    <label class="setting-row">
      <span>Show greeting</span>
      <input type="checkbox" id="toggle-greeting" checked>
    </label>
    <button id="btn-close-settings" class="btn btn-small">Close</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
